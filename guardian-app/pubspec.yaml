name: findma_guardian
description: FindMa 老人防丢系统 · 子女端（Flutter，支持 Android / iOS）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（DESIGN 8）
  flutter_riverpod: ^2.6.1

  # 网络
  http: ^1.2.2

  # 本地登录态
  shared_preferences: ^2.3.3

  # 地图：MapLibre GL + 天地图瓦片（DESIGN 4.2）
  # 注意：0.26.0 起才要求 Flutter 3.29+；0.20.x 仍使用已被移除的
  # PluginRegistry.Registrar（v1 embedding），在 Flutter 3.29+ 上无法编译。
  maplibre_gl: ^0.27.0

  # 扫码绑定（DESIGN 5.4 / 8.1）
  mobile_scanner: ^5.2.3

  # 头像拍摄 / 选取 + 本地裁剪压缩（DESIGN 8）
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
